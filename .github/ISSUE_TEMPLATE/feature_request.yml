name: Feature request
description: Suggest a new content type, style, export option or API capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For new content types please link the relevant specification (RFC, vendor docs) and describe the exact payload format.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Content type
        - Styling / design
        - Export formats
        - Batch generation
        - HTTP API
        - Accessibility
        - Deployment
        - Other
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This feature does not require sending QR content to a third party and keeps the default deployment free of databases or secrets.
