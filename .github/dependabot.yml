version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      cloudflare:
        patterns:
          - 'wrangler'
          - '@cloudflare/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      tooling:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitejs/*'
          - 'eslint*'
          - 'typescript-eslint'
          - 'prettier'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - '@playwright/test'
    ignore:
      # typescript-eslint declares `peer typescript >=4.8.4 <6.1.0`. A newer
      # TypeScript major installs locally with only a warning but makes
      # `npm ci` (CI and Cloudflare Workers Builds) fail with ERESOLVE.
      # Drop this once typescript-eslint supports the new major.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
